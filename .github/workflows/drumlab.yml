name: DrumLab native Linux
on:
  push:
    paths: ['vcv/drumlab/**', '.github/workflows/drumlab.yml']
  pull_request:
    paths: ['vcv/drumlab/**', '.github/workflows/drumlab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Gorgon output engine used for compatibility
        uses: actions/checkout@v4
        with:
          repository: JosiahAlanLee/Gorgon
          ref: cb27eb76aaeb6eef6c00ca5427b75981f2c5e5b7
          path: gorgon-reference
      - name: Install Rack runtime and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjack-jackd2-0 libpulse0 zstd jq
      - name: Fetch pinned Rack SDK
        run: |
          curl --fail --location https://vcvrack.com/downloads/Rack-SDK-2.6.4-lin-x64.zip -o /tmp/rack-sdk.zip
          unzip -q /tmp/rack-sdk.zip -d /tmp
      - name: Build plugin, portable engine and real Rack API tests
        run: |
          make -C vcv/drumlab -j2 RACK_DIR=/tmp/Rack-SDK
          make -C vcv/drumlab/tests all RACK_DIR=/tmp/Rack-SDK
          make -C vcv/drumlab/tests check RACK_DIR=/tmp/Rack-SDK
          make -C vcv/drumlab/tests gorgon-check RACK_DIR=/tmp/Rack-SDK GORGON_DIR="$GITHUB_WORKSPACE/gorgon-reference"
      - name: Address and undefined-behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: make -C vcv/drumlab/tests sanitize RACK_DIR=/tmp/Rack-SDK
      - name: Package prototype and render original-sound audition
        run: |
          make -C vcv/drumlab dist RACK_DIR=/tmp/Rack-SDK
          vcv/drumlab/tests/render /tmp/DrumLab-audition.wav
      - uses: actions/upload-artifact@v4
        with:
          name: DrumLab-lin-x64
          path: vcv/drumlab/dist/*.vcvplugin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DrumLab-audition
          path: /tmp/DrumLab-audition.wav
          if-no-files-found: error
