name: Séance native Linux
on:
  push:
    paths: ['vcv/seance/**', 'vcv/shared/**', '.github/workflows/seance.yml']
  pull_request:
    paths: ['vcv/seance/**', 'vcv/shared/**', '.github/workflows/seance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libRack runtime dependencies
        # libRack.so needs JACK and PulseAudio client libraries to load, even headless.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjack-jackd2-0 libpulse0 zstd jq
      - name: Fetch pinned Rack SDK
        run: |
          curl --fail --location https://vcvrack.com/downloads/Rack-SDK-2.6.4-lin-x64.zip -o /tmp/rack-sdk.zip
          unzip -q /tmp/rack-sdk.zip -d /tmp
      - name: Build and validate
        run: |
          # Each step's output is kept; on failure the tail is echoed as annotations.
          step() { local log=/tmp/step.log rc=0; ( "$@" ) > "$log" 2>&1 || rc=$?; if [ $rc -ne 0 ]; then echo "::error::FAILED (exit $rc): $*"; tail -n 12 "$log" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi; grep -E "dB|latency|frames|PASS" "$log" | while IFS= read -r l; do echo "::notice::$l"; done; tail -n 2 "$log"; }
          # Rack 2 only loads plugins whose version starts with 2.
          for f in vcv/*/plugin.json; do v=$(jq -r .version "$f"); case "$v" in 2.*) ;; *) echo "::error::$f version $v must start with 2. for Rack 2"; exit 1;; esac; done
          step make -C vcv/seance -j2 RACK_DIR=/tmp/Rack-SDK
          step make -C vcv/seance/tests engine_test module_test RACK_DIR=/tmp/Rack-SDK
          step vcv/seance/tests/engine_test
          # Module test under sanitizers first, so a crash comes with a stack trace.
          step g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I/tmp/Rack-SDK/include -I/tmp/Rack-SDK/dep/include vcv/seance/tests/module_test.cpp -L/tmp/Rack-SDK -Wl,-rpath,/tmp/Rack-SDK -lRack -Wl,--allow-shlib-undefined -o /tmp/module_test_asan
          step env ASAN_OPTIONS=detect_leaks=0 /tmp/module_test_asan
          step vcv/seance/tests/module_test
          # Sanitizers on the portable engine.
          step g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-unsafe-math-optimizations vcv/seance/tests/engine_test.cpp -o /tmp/seance_asan
          step /tmp/seance_asan
          step make -C vcv/seance dist RACK_DIR=/tmp/Rack-SDK
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: SeanceLab-lin-x64
          path: vcv/seance/dist/*.vcvplugin
          if-no-files-found: error
