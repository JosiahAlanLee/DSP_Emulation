name: Spoon Bender native Linux
on:
  push:
    paths: ['vcv/spoonbender/**', 'vcv/shared/**', 'vcv/otislab/src/**', 'vcv/otislab/tests/fx_link_test.cpp', '.github/workflows/spoonbender.yml']
  pull_request:
    paths: ['vcv/spoonbender/**', 'vcv/shared/**', 'vcv/otislab/src/**', 'vcv/otislab/tests/fx_link_test.cpp', '.github/workflows/spoonbender.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libRack runtime dependencies
        # libRack.so needs JACK and PulseAudio client libraries to load, even headless.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjack-jackd2-0 libpulse0 zstd jq
      - name: Fetch pinned Rack SDK
        run: |
          curl --fail --location https://vcvrack.com/downloads/Rack-SDK-2.6.4-lin-x64.zip -o /tmp/rack-sdk.zip
          unzip -q /tmp/rack-sdk.zip -d /tmp
      - name: Build and validate
        run: |
          # Each step's output is kept; on failure the tail is echoed as annotations.
          step() { local log=/tmp/step.log rc=0; ( "$@" ) > "$log" 2>&1 || rc=$?; if [ $rc -ne 0 ]; then echo "::error::FAILED (exit $rc): $*"; tail -n 9 "$log" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi; grep -E "dB|RT60|CPU|stability|FREEZE|checks|threads" "$log" | while IFS= read -r l; do echo "::notice::$l"; done; tail -n 2 "$log"; }
          step make -C vcv/spoonbender -j2 RACK_DIR=/tmp/Rack-SDK
          step make -C vcv/spoonbender/tests engine_test module_test RACK_DIR=/tmp/Rack-SDK
          step vcv/spoonbender/tests/engine_test
          # Module test under sanitizers first, so a crash comes with a stack trace.
          step g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I/tmp/Rack-SDK/include -I/tmp/Rack-SDK/dep/include vcv/spoonbender/tests/module_test.cpp -L/tmp/Rack-SDK -Wl,-rpath,/tmp/Rack-SDK -lRack -Wl,--allow-shlib-undefined -o /tmp/module_test_asan
          step env ASAN_OPTIONS=detect_leaks=0 /tmp/module_test_asan
          step vcv/spoonbender/tests/module_test
          # Sanitizers on the portable engine (bounded run: skip nothing, just slower).
          step g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-unsafe-math-optimizations vcv/spoonbender/tests/engine_test.cpp -o /tmp/spoonbender_asan
          step /tmp/spoonbender_asan
          # Capture collection vs sample-rate changes, three threads under ThreadSanitizer.
          # (TSAN needs fewer mmap random bits than the runner kernel's default.)
          sudo sysctl -w vm.mmap_rnd_bits=28
          step make -C vcv/spoonbender/tests capture_race_test
          step vcv/spoonbender/tests/capture_race_test
          # Cross-plugin: real OTIS module code importing from the compiled Spoon Bender binary.
          step make -C vcv/otislab -j2 RACK_DIR=/tmp/Rack-SDK
          step g++ -std=c++17 -O2 -pthread -I/tmp/Rack-SDK/include -I/tmp/Rack-SDK/dep/include vcv/otislab/tests/fx_link_test.cpp -L/tmp/Rack-SDK -Wl,-rpath,/tmp/Rack-SDK -lRack -ldl -Wl,--allow-shlib-undefined -o /tmp/fx_link_test
          step bash -c "cd vcv/otislab/tests && /tmp/fx_link_test ../../spoonbender/plugin.so"
          step make -C vcv/spoonbender dist RACK_DIR=/tmp/Rack-SDK
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: SpoonBenderLab-lin-x64
          path: vcv/spoonbender/dist/*.vcvplugin
          if-no-files-found: error
