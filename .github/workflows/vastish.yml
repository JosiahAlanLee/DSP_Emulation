name: Vastish native Linux
on:
  push:
    paths: ['vcv/vastish/**', 'vcv/shared/**', 'vcv/otislab/src/**', 'pd/vastish/tools/gen_vastish.py', '.github/workflows/vastish.yml']
  pull_request:
    paths: ['vcv/vastish/**', 'vcv/shared/**', 'vcv/otislab/src/**', 'pd/vastish/tools/gen_vastish.py', '.github/workflows/vastish.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libRack runtime dependencies
        # libRack.so needs JACK and PulseAudio client libraries to load, even headless.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjack-jackd2-0 libpulse0 zstd jq
      - name: Fetch pinned Rack SDK and Pd reference
        run: |
          curl --fail --location https://vcvrack.com/downloads/Rack-SDK-2.6.4-lin-x64.zip -o /tmp/rack-sdk.zip
          unzip -q /tmp/rack-sdk.zip -d /tmp
          git clone --depth 1 --branch 0.55-2 https://github.com/pure-data/pure-data.git /tmp/pure-data
          test "$(git -C /tmp/pure-data rev-parse HEAD)" = 68a30a3e2672d0d57baff7d862d6b611c79d53ec
      - name: Build and validate
        run: |
          # Run each step with its output kept; on failure, echo the tail as annotations
          # (readable from the API without the raw log). Notices from tests are surfaced too.
          step() { local log=/tmp/step.log; if ! ( "$@" ) > "$log" 2>&1; then echo "::error::FAILED: $*"; tail -n 20 "$log" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi; grep -i "reuse observed" "$log" | while IFS= read -r l; do echo "::notice::$l"; done; tail -n 3 "$log"; }
          step make -C vcv/vastish -j2 RACK_DIR=/tmp/Rack-SDK
          step make -C vcv/vastish/tests -j2 all reference_compare RACK_DIR=/tmp/Rack-SDK PD_DIR=/tmp/pure-data
          step vcv/vastish/tests/engine_test
          step bash -c "cd vcv/vastish/tests && ./sample_test"
          step vcv/vastish/tests/adapter_test
          # Cross-plugin OTIS link against OtisLab's compiled binary.
          step make -C vcv/otislab -j2 RACK_DIR=/tmp/Rack-SDK
          step make -C vcv/vastish/tests link_test RACK_DIR=/tmp/Rack-SDK
          step bash -c "cd vcv/vastish/tests && ./link_test"
          step vcv/vastish/tests/reference_compare
          step bash -c "cd vcv/vastish && LD_LIBRARY_PATH=/tmp/Rack-SDK tests/plugin_test"
          step make -C vcv/vastish dist RACK_DIR=/tmp/Rack-SDK
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: VastishLab-lin-x64
          path: vcv/vastish/dist/*.vcvplugin
          if-no-files-found: error
