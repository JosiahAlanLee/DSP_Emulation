name: Vastish native Linux
on:
  push:
    paths: ['vcv/vastish/**', 'pd/vastish/tools/gen_vastish.py', '.github/workflows/vastish.yml']
  pull_request:
    paths: ['vcv/vastish/**', 'pd/vastish/tools/gen_vastish.py', '.github/workflows/vastish.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Rack SDK and Pd reference
        run: |
          curl --fail --location https://vcvrack.com/downloads/Rack-SDK-2.6.4-lin-x64.zip -o /tmp/rack-sdk.zip
          unzip -q /tmp/rack-sdk.zip -d /tmp
          git clone --depth 1 --branch 0.55-2 https://github.com/pure-data/pure-data.git /tmp/pure-data
          test "$(git -C /tmp/pure-data rev-parse HEAD)" = 68a30a3e2672d0d57baff7d862d6b611c79d53ec
      - name: Build and validate
        run: |
          r() { echo "== $*" >> /tmp/ci.log; "$@" >> /tmp/ci.log 2>&1 || echo "FAILED($?): $*" >> /tmp/ci.log; }
          r make -C vcv/vastish -j2 RACK_DIR=/tmp/Rack-SDK
          r make -C vcv/vastish/tests -j2 all reference_compare RACK_DIR=/tmp/Rack-SDK PD_DIR=/tmp/pure-data
          r vcv/vastish/tests/engine_test
          r vcv/vastish/tests/adapter_test
          r vcv/vastish/tests/reference_compare
          cd vcv/vastish
          LD_LIBRARY_PATH=/tmp/Rack-SDK r tests/plugin_test
          r make dist RACK_DIR=/tmp/Rack-SDK
          grep -B2 -A8 "FAILED\|rror\|==" /tmp/ci.log | grep -v "cpu_seconds" | tail -c 3500 | python3 -c 'import sys; d=sys.stdin.read() or "no failures"; print("::warning title=ci-log::"+d.replace("%","%25").replace("\r","").replace("\n","%0A"))'
