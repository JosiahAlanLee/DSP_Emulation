name: OtisLab native Linux
on:
  push:
    paths: ['vcv/otislab/**', '.github/workflows/otislab.yml']
  pull_request:
    paths: ['vcv/otislab/**', '.github/workflows/otislab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libRack runtime dependencies
        # libRack.so needs JACK and PulseAudio client libraries to load, even headless.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjack-jackd2-0 libpulse0 zstd jq
      - name: Fetch pinned Rack SDK and ES5505 reference core
        run: |
          curl --fail --location https://vcvrack.com/downloads/Rack-SDK-2.6.4-lin-x64.zip -o /tmp/rack-sdk.zip
          unzip -q /tmp/rack-sdk.zip -d /tmp
          git clone --quiet https://github.com/mardlib/Ensoniq-EPS-16-Plus.git /tmp/mardlib
          git -C /tmp/mardlib checkout --quiet 6230f38886d98c80edf39ef5cfeae3cf25a492d1
      - name: Build and validate
        working-directory: vcv/otislab
        run: |
          make -j2 RACK_DIR=/tmp/Rack-SDK
          make -C tests test
          # Newer runner kernels use more mmap randomness than GCC 11's sanitizers expect.
          sudo sysctl -w vm.mmap_rnd_bits=28
          make -C tests sanitize
          make -C tests window-sanitize
          make -C tests thread-sanitize
          # Bit-exact comparison of the playback core against the reference ES5505 implementation.
          gcc -O2 -c /tmp/mardlib/native/es5505_core.c -o tests/build/reference_core.o
          g++ -std=c++17 -O2 -I/tmp/mardlib/native tests/reference_compare.cpp tests/build/reference_core.o -o tests/build/reference_compare
          tests/build/reference_compare
          # The compiled plugin.so exercised through Rack's own API, without a GUI.
          g++ -std=c++17 -O2 -I/tmp/Rack-SDK/include -I/tmp/Rack-SDK/dep/include tests/plugin_test.cpp \
            -L/tmp/Rack-SDK -Wl,-rpath,/tmp/Rack-SDK -lRack -ldl -Wl,--allow-shlib-undefined -o tests/build/plugin_test
          tests/build/plugin_test
          g++ -std=c++17 -O2 -pthread -I/tmp/Rack-SDK/include -I/tmp/Rack-SDK/dep/include tests/window_plugin_test.cpp \
            -L/tmp/Rack-SDK -Wl,-rpath,/tmp/Rack-SDK -lRack -ldl -Wl,--allow-shlib-undefined -o tests/build/window_plugin_test
          tests/build/window_plugin_test
          # Default host output must still match the 2.2.0 baseline byte for byte.
          curl --fail --location https://raw.githubusercontent.com/JosiahAlanLee/DSP_Emulation/c2c014014046a18f6d318c10e26cc45f4706d06b/vcv/otislab/src/engine/OtisEngine.hpp -o /tmp/otis-baseline.hpp
          g++ -std=c++17 -O2 -pthread -DOTIS_ENGINE_HEADER='"/tmp/otis-baseline.hpp"' tests/legacy_trace.cpp -o tests/build/old_trace
          g++ -std=c++17 -O2 -pthread tests/legacy_trace.cpp -o tests/build/new_trace
          test "$(tests/build/old_trace)" = "$(tests/build/new_trace)"
          make dist RACK_DIR=/tmp/Rack-SDK
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: OtisLab-lin-x64
          path: vcv/otislab/dist/*.vcvplugin
          if-no-files-found: error
