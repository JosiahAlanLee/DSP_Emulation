name: Machinemodule Rack prototype
on:
  push:
    paths: ['vcv/machinemodule/**', 'vcv/shared/GorgonSound.hpp', '.github/workflows/machinemodule.yml']
  pull_request:
    paths: ['vcv/machinemodule/**', 'vcv/shared/GorgonSound.hpp', '.github/workflows/machinemodule.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out matching Gorgon sound-link producer
        uses: actions/checkout@v4
        with:
          repository: JosiahAlanLee/Gorgon
          ref: 5857490d30d3e12fbce1dd18ad9f5f0b00dabbc3
          path: gorgon-reference
      - name: Install native build and Rack runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build libjack-jackd2-0 libpulse0 zstd
      - name: Fetch Rack SDK and pinned core source
        run: |
          curl --fail --location https://vcvrack.com/downloads/Rack-SDK-2.6.4-lin-x64.zip -o /tmp/rack-sdk.zip
          unzip -q /tmp/rack-sdk.zip -d /tmp
          vcv/machinemodule/tools/fetch-core.sh
      - name: Build adapter, real Rack interop and optional firmware-test executable
        run: |
          cmake -S vcv/machinemodule -B vcv/machinemodule/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRACK_DIR=/tmp/Rack-SDK -DGORGON_DIR="$GITHUB_WORKSPACE/gorgon-reference"
          cmake --build vcv/machinemodule/build --target plugin control_test renderer_test worker_test module_test firmware_test -j2
          cmp vcv/shared/GorgonSound.hpp gorgon-reference/spec/sound-link.hpp
          ctest --test-dir vcv/machinemodule/build --output-on-failure
      - name: Sanitize adapter and worker without any firmware
        run: |
          cmake -S vcv/machinemodule -B vcv/machinemodule/build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMD_RACK_SANITIZE=ON
          cmake --build vcv/machinemodule/build-sanitize --target control_test renderer_test worker_test -j2
          ASAN_OPTIONS=detect_leaks=0 ctest --test-dir vcv/machinemodule/build-sanitize --output-on-failure
      - name: Package binary with corresponding source; exclude all OS/sample data
        run: |
          python3 vcv/machinemodule/tools/source_bundle.py vcv/machinemodule/_deps/machinemodule
          python3 vcv/machinemodule/tools/package.py
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          source = Path('vcv/machinemodule/dist/MachinemoduleRack-2.0.0-source.tar.gz')
          with tarfile.open(source) as tar:
              names = tar.getnames()
              assert any(n.endswith('asmjit/src/asmjit/core/builder.cpp') for n in names)
              assert any(n.endswith('dsp56300/LICENSE.md') for n in names)
              assert not any(n.lower().endswith(('.syx', '.bin', '.so', '.dll', '.dylib')) for n in names)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MachinemoduleRack-linux-prototype-and-source
          path: |
            vcv/machinemodule/dist/*.vcvplugin
            vcv/machinemodule/dist/*-source.tar.gz
          if-no-files-found: error
