name: Byte bus register native Linux
on:
  push:
    paths: ['vcv/bytebus/**', 'vcv/shared/ByteBus.hpp', 'vcv/vastish/**', 'docs/BYTE_BUS_SPEC.md', '.github/workflows/bytebus.yml']
  pull_request:
    paths: ['vcv/bytebus/**', 'vcv/shared/ByteBus.hpp', 'vcv/vastish/**', 'docs/BYTE_BUS_SPEC.md', '.github/workflows/bytebus.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and libRack runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjack-jackd2-0 libpulse0 zstd jq
      - name: Fetch pinned Rack SDK
        run: |
          curl --fail --location https://vcvrack.com/downloads/Rack-SDK-2.6.4-lin-x64.zip -o /tmp/rack-sdk.zip
          unzip -q /tmp/rack-sdk.zip -d /tmp
      - name: Build plugin and exercise real Rack/Vastish feedback
        run: |
          make -C vcv/bytebus -j2 RACK_DIR=/tmp/Rack-SDK
          make -C vcv/bytebus/tests check RACK_DIR=/tmp/Rack-SDK
      - name: Address and undefined-behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: make -C vcv/bytebus/tests sanitize RACK_DIR=/tmp/Rack-SDK
      - name: Package prototype
        run: make -C vcv/bytebus dist RACK_DIR=/tmp/Rack-SDK
      - uses: actions/upload-artifact@v4
        with:
          name: ByteBusLab-lin-x64
          path: vcv/bytebus/dist/*.vcvplugin
          if-no-files-found: error
