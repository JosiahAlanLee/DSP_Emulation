name: Gorgon native Linux
on:
  push:
    paths: ['vcv/gorgon/**', 'vcv/shared/glyphs/**', '.github/workflows/gorgon.yml']
  pull_request:
    paths: ['vcv/gorgon/**', 'vcv/shared/glyphs/**', '.github/workflows/gorgon.yml']
  workflow_dispatch:
    inputs:
      hydrapy_ref:
        description: 'Optional HydraPy compatibility ref (default is the pinned baseline)'
        type: string
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JosiahAlanLee/hydrapy
          ref: ${{ inputs.hydrapy_ref || 'a4b6913e77b7683d9b23c063424b6e37e7cec491' }}
          path: .integration/hydrapy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install libRack runtime dependencies and jansson
        # libRack.so needs JACK and PulseAudio client libraries to load, even headless.
        # jansson is for the portable bridge tests, which don't link libRack.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjack-jackd2-0 libpulse0 zstd jq libjansson-dev
      - name: Fetch pinned Rack SDK
        run: |
          curl --fail --location https://vcvrack.com/downloads/Rack-SDK-2.6.4-lin-x64.zip -o /tmp/rack-sdk.zip
          unzip -q /tmp/rack-sdk.zip -d /tmp
      - name: Build and validate
        run: |
          step() { local log=/tmp/step.log rc=0; ( "$@" ) > "$log" 2>&1 || rc=$?; if [ $rc -ne 0 ]; then echo "::error::FAILED (exit $rc): $*"; tail -n 12 "$log" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi; grep -E "fixture|follower|clock edges" "$log" | while IFS= read -r l; do echo "::notice::$l"; done; tail -n 2 "$log"; }
          for f in vcv/*/plugin.json; do v=$(jq -r .version "$f"); case "$v" in 2.*) ;; *) echo "::error::$f version $v must start with 2. for Rack 2"; exit 1;; esac; done
          step make -C vcv/gorgon -j2 RACK_DIR=/tmp/Rack-SDK
          # Portable engine and bridge tests (the engine against HydraPy's own outputs).
          step make -C vcv/gorgon/tests test
          # Verify the current producer, not only the checked-in reference file.
          step python -m pip install -e .integration/hydrapy
          git -C .integration/hydrapy rev-parse HEAD
          python vcv/gorgon/tools/make_fixture.py > /tmp/gorgon-current-fixture.txt
          step cmp vcv/gorgon/tests/fixture.txt /tmp/gorgon-current-fixture.txt
          step vcv/gorgon/tests/engine_test /tmp/gorgon-current-fixture.txt
          step make -C vcv/gorgon/tests e2e
          sudo sysctl -w vm.mmap_rnd_bits=28   # ThreadSanitizer on newer runner kernels
          step make -C vcv/gorgon/tests sanitize
          # The real module through Rack's API, without a GUI; sanitizers first for stack traces.
          step g++ -std=c++17 -O1 -g -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -I/tmp/Rack-SDK/include -I/tmp/Rack-SDK/dep/include -Ivcv/gorgon/src vcv/gorgon/tests/module_test.cpp -L/tmp/Rack-SDK -Wl,-rpath,/tmp/Rack-SDK -lRack -Wl,--allow-shlib-undefined -o /tmp/gorgon_module_asan
          step env ASAN_OPTIONS=detect_leaks=0 /tmp/gorgon_module_asan
          step make -C vcv/gorgon/tests module_test RACK_DIR=/tmp/Rack-SDK
          step vcv/gorgon/tests/module_test
          step make -C vcv/gorgon dist RACK_DIR=/tmp/Rack-SDK
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: GorgonBridge-lin-x64
          path: vcv/gorgon/dist/*.vcvplugin
          if-no-files-found: error
