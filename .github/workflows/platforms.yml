name: Windows and macOS builds
# Linux builds and the full validation suite live in otislab.yml and vastish.yml.
# This workflow produces the other platforms' .vcvplugin files. They are compiled
# here but not run inside Rack, so treat them as untested until someone reports.
on:
  push:
    paths: ['vcv/**', '.github/workflows/platforms.yml']
  pull_request:
    paths: ['vcv/**', '.github/workflows/platforms.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  RACK_SDK_VERSION: 2.6.4
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [otislab, vastish]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make zip unzip jq rsync
            mingw-w64-x86_64-gcc mingw-w64-x86_64-zstd
      - name: Fetch Rack SDK
        run: |
          curl --fail --location "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-win-x64.zip" -o /tmp/rack-sdk.zip
          unzip -q /tmp/rack-sdk.zip -d /tmp
      - name: Portable engine tests
        if: matrix.plugin == 'otislab'
        working-directory: vcv/otislab
        run: make -C tests test
      - name: Build plugin
        working-directory: vcv/${{ matrix.plugin }}
        run: |
          # Failures are echoed as annotations so they are readable without the raw log.
          report() { tail -n 15 "$1" | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          make -j2 RACK_DIR=/tmp/Rack-SDK > /tmp/build.log 2>&1 || report /tmp/build.log
          make dist RACK_DIR=/tmp/Rack-SDK > /tmp/dist.log 2>&1 || report /tmp/dist.log
          # The DLL must not depend on MinGW runtime DLLs that Rack does not ship.
          objdump -p plugin.dll | grep "DLL Name" | tee /tmp/deps.log
          while IFS= read -r line; do echo "::notice::$line"; done < /tmp/deps.log
          if grep -Ei "(libstdc|libgcc|libwinpthread)" /tmp/deps.log; then echo "::error::plugin.dll depends on a MinGW runtime DLL"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-win-x64
          path: vcv/${{ matrix.plugin }}/dist/*.vcvplugin
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [otislab, vastish]
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install zstd jq
      - name: Fetch Rack SDK
        run: |
          curl --fail --location "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-mac-${{ matrix.arch }}.zip" -o /tmp/rack-sdk.zip
          unzip -q /tmp/rack-sdk.zip -d /tmp
      - name: Portable engine tests
        # The runner is Apple Silicon, so only the native arm64 tests run.
        if: matrix.plugin == 'otislab' && matrix.arch == 'arm64'
        working-directory: vcv/otislab
        run: make -C tests test CXX=clang++
      - name: Build plugin
        working-directory: vcv/${{ matrix.plugin }}
        run: |
          if [ "${{ matrix.arch }}" = x64 ]; then CROSS="CROSS_COMPILE=x86_64-apple-darwin"; fi
          make -j3 RACK_DIR=/tmp/Rack-SDK $CROSS
          make dist RACK_DIR=/tmp/Rack-SDK $CROSS
          lipo -archs plugin.dylib
          test "$(lipo -archs plugin.dylib)" = "$( [ ${{ matrix.arch }} = x64 ] && echo x86_64 || echo arm64 )"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-mac-${{ matrix.arch }}
          path: vcv/${{ matrix.plugin }}/dist/*.vcvplugin
          if-no-files-found: error
